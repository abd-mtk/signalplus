name: signalplus
description: "Receives push notifications and manages the signed-in person's device, profile, preferences and topics in the SignalPlus service."
version: 0.2.3
repository: https://github.com/abd-mtk/signalplus
publish_to: none

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^22.3.3
  fpdart: ^1.2.0
  equatable: ^3.0.0
  http: ^1.6.0
  uuid: ^4.6.0
  device_info_plus: ^13.3.0
  package_info_plus: ^10.2.2
  flutter_secure_storage: ^11.2.0
  flutter_timezone: ^5.1.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.signalplus
        pluginClass: SignalPlusPlugin
      ios:
        pluginClass: SignalPlusPlugin
